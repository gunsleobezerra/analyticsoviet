name: analyticsoviet

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: analyticsoviet:local
    restart: unless-stopped
    init: true
    ports:
      - "${API_PORT:-8000}:8000"
    # .env (if present) supplies rate limits, timeouts, cookie paths, etc.
    env_file:
      - path: .env
        required: false
    # These override .env on purpose: they must point at the compose network.
    environment:
      ENVIRONMENT: prod
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite+aiosqlite:///./data/analyticsoviet.db
      ENABLE_HISTORY: "true"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
    volumes:
      - api-data:/app/data
      # Optional Netscape cookie jars (read-only). Create ./cookies/ on the host.
      - ./cookies:/app/cookies:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

volumes:
  api-data:
  redis-data:
