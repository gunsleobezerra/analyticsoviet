name: analyticsoviet

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: analyticsoviet:local
    restart: unless-stopped
    init: true
    ports:
      - "${API_PORT:-8008}:8000"
    # .env (if present) supplies rate limits, timeouts, cookie paths, etc.
    env_file:
      - path: .env
        required: false
    # These override .env on purpose: they must point at the compose network.
    environment:
      ENVIRONMENT: prod
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite+aiosqlite:///./data/analyticsoviet.db
      ENABLE_HISTORY: "true"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-1}"
      # Storage backend for cookies ('local' or 's3')
      COOKIES_STORAGE_BACKEND: "${COOKIES_STORAGE_BACKEND:-local}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_COOKIES_BUCKET: "${S3_COOKIES_BUCKET:-}"
      S3_COOKIES_PREFIX: "${S3_COOKIES_PREFIX:-}"
      S3_REGION_NAME: "${S3_REGION_NAME:-us-east-1}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_SESSION_TOKEN: "${S3_SESSION_TOKEN:-}"
    volumes:
      - api-data:/app/data
      # Cookie jars: local folder or S3 sync target (writable by container)
      - ./cookies:/app/cookies
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

volumes:
  api-data:
  redis-data:
