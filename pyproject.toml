[project]
name = "analyticsoviet"
version = "0.1.0"
description = "Social media metrics API - HTML-only scraping for YouTube, TikTok, Instagram and Facebook"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx[http2]>=0.27",
    "h2>=4.1",
    "brotli>=1.1",
    "selectolax>=0.3.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "python-dateutil>=2.9",
    "swagger-ui-bundle>=1.1.0",
]

[project.optional-dependencies]
ytdlp = ["yt-dlp>=2024.10.7"]
redis = ["redis>=5.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-dateutil",
]
s3 = ["boto3 (>=1.34)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["live: hits real networks (opt-in, set LIVE=1)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "UP042", "RUF046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
